name: Verify and publish demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: make fixture
      - run: make eval
      - run: make test
      - run: |
          mkdir -p pages
          cp docs/index.html pages/index.html
          cp evals/SYNTHETIC_holdout.json pages/report.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
